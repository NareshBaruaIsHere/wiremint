name: Publish Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Set to 'true' to execute publication to npm"
        required: true
        default: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-publish:
    name: Build, Verify & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm provenance / trusted publishing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run test suite
        run: pnpm test

      - name: Build production package
        run: pnpm build

      - name: Dry-run package creation
        run: npm pack --dry-run

      - name: Verify external package consumer
        run: node scripts/verify-consumer.mjs

      - name: Publish to npm (Dry-Run by default)
        if: ${{ github.event.inputs.publish != 'true' }}
        run: |
          echo "Release verification complete! Publishing is guarded and disabled by default."
          echo "To execute actual publication, run this workflow with input: publish=true"

      - name: Publish to npm
        if: ${{ github.event.inputs.publish == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm publish --access public --no-git-checks --provenance

