name: Publish Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Set to true to execute publication to npm via OIDC trusted publishing"
        type: boolean
        required: true
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-publish:
    name: Build, Verify & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm provenance and OIDC trusted publishing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - name: Setup Node.js 26 (npm >= 11.5.1)
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Verify npm CLI version
        run: |
          echo "Node version: $(node -v)"
          echo "npm version: $(npm -v)"

      - name: Install dependencies
        run: pnpm install

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run test suite
        run: pnpm test

      - name: Build production package
        run: pnpm build

      - name: Build documentation
        run: pnpm docs:build

      - name: Dry-run package creation
        run: npm pack --dry-run

      - name: Verify external package consumer
        run: node scripts/verify-consumer.mjs

      - name: Validate publication (Dry-run by default)
        if: ${{ inputs.publish != true }}
        run: |
          echo "Running publication dry-run..."
          npm publish --dry-run --provenance --access public
          echo ""
          echo "=========================================================================="
          echo "Release verification passed! Publishing was NOT executed (publish: false)."
          echo "To execute actual publication, run this workflow with input: publish=true"
          echo "=========================================================================="

      - name: Execute trusted publish to npm
        if: ${{ inputs.publish == true }}
        run: |
          echo "Executing npm publish with OIDC provenance..."
          npm publish --provenance --access public
