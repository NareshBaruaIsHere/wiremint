name: Release Preflight Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-package:
    name: Validate Package Integrity & Exports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build package
        run: pnpm build

      - name: Dry-run npm pack
        run: npm pack --dry-run

      - name: Verify consumer installation
        run: node scripts/verify-consumer.mjs

