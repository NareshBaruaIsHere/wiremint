name: Bug Report
description: Report a reproducible defect or unexpected behavior in Wiremint.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with Wiremint! Please provide as much context and a minimal reproduction so we can resolve it promptly.
  - type: input
    id: version
    attributes:
      label: Wiremint Version
      description: What version of Wiremint are you running? (e.g. 0.1.0)
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: Output of `node -v`
      placeholder: v22.12.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Current Behavior
      description: Describe what happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: Describe what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction Code
      description: Provide a minimal code snippet or script reproducing the problem.
      render: typescript
    validations:
      required: true

